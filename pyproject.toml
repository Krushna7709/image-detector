[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-detector"
version = "0.1.0"
description = "Detect, localize and attribute AI-generated images with explainable forensic evidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Krushna" }]
keywords = ["ai-image-forensics", "deepfake-detection", "provenance", "c2pa", "clip"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Environment :: Web Environment",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "Pillow>=10.2",
    "pydantic>=2.6",
    "joblib>=1.3",
    "scikit-learn>=1.3,<1.9",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.38",
    "scipy>=1.11",
    "diffusers>=0.27",
    "accelerate>=0.29",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aiforensics = "aiforensics.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiforensics = ["api/static/*", "api/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
